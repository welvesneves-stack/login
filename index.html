<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/login/Css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Validacao</title>
</head>

<body>
    <main>
        <form action="" id="form">
            <div class="container">
                <div id="azul" class="azul">
                    <div class="pergunta1" id="pergunta1">
                        <h3>Ainda não possui uma conta?</h3>
                        <button type="button" class="btnazul" id="btnazul1"><i
                                class="fa-solid fa-right-to-bracket"></i>Resgistrar</button>
                    </div>
                    <div class="pergunta2" id="pergunta2">
                        <h3>Já possui uma conta?</h3>
                        <button type="button" class="btnazul" id="btnazul2"><i
                                class="fa-solid fa-right-to-bracket"></i>Entrar</button>
                    </div>
                </div>
                <div id="branco" class="branco">
                    <div class="entrar" id="entrarlado">
                        <h2>Entrar <i class="fa-solid fa-right-to-bracket"></i></h2>
                        <label for="email">E-mail:</label>
                        <div class="iconeEcampo">
                            <input type="email" name="" id="email" required pattern="[^@]+@[^@]+\.[a-z]{2,}"
                                placeholder="nome@gmail.com" title="Colocque o seu e-mail" autocomplete="email">
                            <i class="fa-regular fa-envelope"></i>
                        </div>
                        <span class="erro-email"></span>
                        <br><label for="senha">Senha:</label>
                        <div class="iconeEcampo">
                            <input type="password" name="" id="senha" required
                                pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" minlength="8" placeholder="********"
                                title="Digite a senha" autocomplete="current-password">
                            <i class="fa-solid fa-eye-slash olho"></i>
                        </div>
                        <span class="erro-senha"></span>
                        <div class="esqueceuSenha">
                            <button type="submit" id="btnentrar">
                                <i class="fa-solid fa-right-to-bracket"></i>
                                Entrar
                            </button>
                            <p><a href="">Esqueci-me</a></p>
                        </div>
                        <p>Entrar com:</p>
                        <div class="icones">
                            <a href=""><i class="fa-brands fa-github"></i></a>
                            <a href=""><i class="fa-brands fa-google"></i></a>
                            <a href=""><i class="fa-brands fa-facebook"></i></a>
                            <a href=""><i class="fa-brands fa-linkedin"></i></a>
                        </div>
                    </div>
                    <div class="registrar" id="registrarlado">
                        <h2>Registar <i class="fa-solid fa-user-plus"></i></h2>
                        <div class="campos">
                            <div class="nomeApelido">
                                <div>
                                    <label for="nome">Nome:</label>
                                    <div class="iconeEcampo">
                                        <input type="text" name="" id="nome" required minlength="3" maxlength="30"
                                            pattern="[A-Za-z ]+" title="coloque seu primeiro nome"
                                            placeholder="Ex:.       welves">
                                        <i class="fa-solid fa-user"></i>
                                    </div>
                                    <span class="erro-nome"></span>
                                </div>
                                <div>
                                    <label for="apelido">Apelido:</label>
                                    <div class="iconeEcampo">
                                        <input type="text" name="" id="apelido" required minlength="3" maxlength="30"
                                            pattern="[A-Za-z ]+" title="coloque seu ultimo nome"
                                            placeholder="Ex:.         Neves">
                                        <i class="fa-regular fa-user"></i>
                                    </div>
                                    <span class="erro-apelido"></span>
                                </div>
                            </div>
                            <div class="numeroEmail">
                                <div>
                                    <label for="contacto">Contacto:</label>
                                    <div class="iconeEcampo">
                                        <input type="tel" name="" id="contacto" required pattern="8[2-7][0-9]{7}"
                                            maxlength="9" placeholder="Ex:.  847370290" title="digite o seu contacto">
                                        <i class="fa-solid fa-phone"></i>
                                    </div>
                                    <span class="erro-contacto"></span>
                                </div>
                                <div>
                                    <label for="Email">E-mail:</label>
                                    <div class="iconeEcampo">
                                        <input type="email" name="Email" id="Email" pattern="[^@]+@[^@]+\.[a-z]{2,}"
                                            required placeholder="nome@gmail.com" title="Colocque o seu e-mail"
                                            autocomplete="email">
                                        <i class="fa-regular fa-envelope"></i>
                                    </div>
                                    <span class="erro-email1"></span>
                                </div>
                            </div>
                            <div class="passwords">
                                <div>
                                    <label for="senha1">Senha:</label>
                                    <div class="iconeEcampo">
                                        <input type="password" name="" id="senha1" minlength="8" required
                                            pattern="(?=.*\d)(?=.*[A-Z])(?=.*[a-z]).{8,}" placeholder="********"
                                            title="Digite a senha" autocomplete="new-password">
                                        <i class="fa-solid fa-eye-slash olho"></i>
                                    </div>
                                    <span class="erro-senha1"></span>
                                </div>
                                <div>
                                    <label for="confirm">Confirmar senha:</label>
                                    <div class="iconeEcampo">
                                        <input type="password" name="" id="confirm" required placeholder="********"
                                            title="Confirme a senha">
                                        <i class="fa-solid fa-eye-slash olho"></i>
                                    </div>
                                    <span class="erro-confirm"></span>
                                </div>
                            </div>
                        </div>
                        <button type="submit" id="btnregistrar">
                            <i class="fa-solid fa-right-to-bracket"></i>
                            Registrar
                        </button>
                        <p>Registrar com:</p>
                        <div class="icones">
                            <a href=""><i class="fa-brands fa-github"></i></a>
                            <a href=""><i class="fa-brands fa-google"></i></a>
                            <a href=""><i class="fa-brands fa-facebook"></i></a>
                            <a href=""><i class="fa-brands fa-linkedin"></i></a>
                        </div>
                    </div>
                </div>
            </div>
            </div>
        </form>
    </main>
    <script src="/login/javascript/login.js"></script>
</body>

</html>
